[VER]
ota_config_ver = 0.0.9 ; otaconfig.ini 文件版本号，所有人修改配置文件后，请自增版本号
ota_config_ver_time = 2022-01-12 10:31 ; 最后一次修改的时间，请修改者记录
ota_config_ver_modify_author = mengwei;   最后的修改者，请修改作者名，用于记录最新版本的修改人
ota_config_ver_modify_content = Initial creation, route add of someip rpc \
增加日志大小和存储文件个数配置 \
增加KVStorage的存储目录，并修改程序运行的默认目录 \
增加实车版本和非实车版本标识，用于区分获取默认vin和实车上获取vin \
增加进程启动等待网络恢复的时间配置选项 \
增加文件解压的指定目录 \
增加VRPC的配置信息 \
增加车云通信使用的默认secret \
增加kvstorage是否加密存储的标识\
增加ewebsrv的log路径配置 \
增加文件下载的协议类型; 所有修改者请记录修改的内容
ota_config_oem_logo = ABUP DEFAULT_VEHICLE; OEM的标识，包括：车厂和车型等

[VUS]
is_real_vehicle_ver = N;        Y:实车版本; N:非实车版本
default_vehicle_iden = EVG20210625111000;   默认的台架测试vin码，测试同学可修改  
is_kvstorage_encrypt = N;       Y:需要加密; N:不需要加密 

runtime_root_dir = /tmp/admota/ucm/;    VUS主控程序运行的主目录
kv_storage_dir = /tmp/admota/ucm/kvstorage/; VUS主控程序，kv持久存储目录
pkg_storage_dir = /tmp/admota/ucm/package/; VUS主控程序升级包下载的存储目录
log_storage_dir = /tmp/admota/ucm/log/; VUS主控程序日志存储目录
cert_storage_dir = /tmp/admota/ucm/cert/; VUS主控程序日志存储目录
unzip_storage_dir = /tmp/admota/ucm/unzip/;  VUS主控程序解压信息存储目录

wait_network_ok_sec = 3;       进程启动等待网络恢复的时间，单位:Second
hmipolicyfile_is_download = Y;  是否需要下载HMI策略文件

log_max_size_of_single_file = 1045504;    单个日志文件存储的大小，单位：Byte
log_max_rotate_file = 5;                  最多存储的文件个数

comm_cert_path = /tmp/admota/ucm/cert/comm.cert; VUS主控程序与OTA平台通信的证书路径(注册、检测、上报等)
cdn_cert_path = /tmp/admota/ucm/cert/cdn.cert; VUS主控程序与CDN平台通信的证书路径(升级包下载)
rpc_comm_cert_path = /tmp/admota/ucm/cert/rpccomm.cert; VUS主控程序与从控程序通信使用的证书路径

ota_server_business_protocol_type = 1; 业务通信接口的协议类型 1:http; 2:https; 3:mqtt; 4. mqtts
ota_server_default_secret = 39cabdfaab8c4da09bd6e9823c527836;   车云通信使用的默认Secret
ota_server_register_url = http://votav5-api.abupdate.com/v50/vehicle/api/register; 向OTA平台请求注册的地址
ota_server_check_url = http://votav5-api.abupdate.com/v50/vehicle/api/%s/check; 向OTA平台请求检测的地址
ota_server_get_config_url = http://votav5-api.abupdate.com/v50/vehicle/api/%s/client/config; 向OTA平台请求获取配置的地址
ota_server_get_icp_url = https://votav5-api.abupdate.com/v50/vehicle/api/%s/queryIcpRecord; 向OTA平台请求获取ICP的地址
ota_server_report_vehicle_info_url = http://votav5-api.abupdate.com/v50/vehicle/api/%s/report/vehicle/config; 向OTA平台请求上报车辆信息的地址
ota_server_vehicle_state_report_url = http://votav5-api.abupdate.com/v50/vehicle/api/%s/state/report; 向OTA平台请求上报车辆状态的地址
ota_server_ecu_state_report_url = http://votav5-api.abupdate.com/v50/vehicle/api/%s/ecu/state/report; 向OTA平台请求上报ECU状态的地址
ota_server_progress_report_url = http://votav5-api.abupdate.com/v50/vehicle/api/%s/progress/report; 向OTA平台请求上报进度信息的地址
ota_server_event_report_url = http://votav5-api.abupdate.com/v50/vehicle/api/%s/event/report; 向OTA平台请求上报事件的地址
ota_server_file_upload_url = http://votav5-api.abupdate.com/v50/vehicle/api/%s/file/upload; 向OTA平台请求上传日志的地址
ota_server_file_download_protocol_type = 1; 文件下载的协议类型 1:http; 2:https

ota_server_mqtt_ip_or_domain = 113.40.5.62;   与平台使用MQTT协议连接的地址/域名
ota_server_mqtt_port = 60123; 与平台使用MQTT协议连接的端口
ota_server_mqtt_user = ABUP_EVG; 与平台使用MQTT协议认证的用户名
ota_server_mqtt_passwd = Abup@123456; 与平台使用MQTT协议认证的密码

ota_server_mqtt_api_name_register = /v50/vehicle/api/register; 向OTA平台请求注册，使用的API Name
ota_server_mqtt_api_name_get_config = /v50/vehicle/api/%s/client/config; 向OTA平台请求获取车端配置，使用的API Name
ota_server_mqtt_api_name_report_vehicle_info = /v50/vehicle/api/%s/report/vehicle/config; 向OTA平台上报汽车端信息，使用的API Name
ota_server_mqtt_api_name_check = /v50/vehicle/api/%s/check; 向OTA平台请求版本检测，使用的API Name
ota_server_mqtt_api_name_vehicle_state_report = /v50/vehicle/api/%s/state/report; 向OTA平台上报车辆状态，使用的API Name
ota_server_mqtt_api_name_ecu_state_report = /v50/vehicle/api/%s/ecu/state/report; 向OTA平台上报ECU状态，使用的API Name
ota_server_mqtt_api_name_progress_report = /v50/vehicle/api/{deviceId}/progress/report; 向OTA平台上报进度信息，使用的API Name
ota_server_mqtt_api_name_event_report = /v50/vehicle/api/{deviceId}/event/report; 向OTA平台上报事件信息，使用的API Name


[DIS_SOC]
soa_soc_tcp_mode = 1; 1:client, 2:server
soa_tcp_server_ip = 192.168.86.123;		SOA服务IP
soa_tcp_server_port = 12345;		SOA服务端口

soa_tcp_host_ip = 192.168.86.123;	SOA地址
soa_soc_host_instance_id = 2;			SOA实例ID

soa_soc_app_instance_id = 1;		fotaapp 实例ID

soa_soc_try_connect_time = 2;		掉线重连,重试次数; -1 一直重试
soa_soc_try_connect_interval = 30;

soa_soc_heart_count = 2;			最大次数内无心跳, 进入掉线重连阶段
soa_soc_heart_interval = 30;		心跳时间间隔

[EWEB]
document_root_dir = /tmp/admota/ucm/; Ewebserver使用的主目录
document_upload_dir = /tmp/admota/ucm/trans/upload/; Ewebserver使用的文件上传目录
document_download_dir = /tmp/admota/ucm/trans/download/; Ewebserver使用文件的下载目录
log_storage_path = /tmp/admota/ucm/log/ewebsrvlog.txt;  Ewebserver存储日志文件的路径
is_https = N;   Ewebserver是否为HTTPS协议
listening_ip = 192.168.0.6;     Ewebserver监听的IP
listening_ports = 8082;  Ewebserver监听的端口
enable_keep_alive = no;   保持长链接状态
ssl_certificate = /tmp/admota/ucm/cert/trans.crt; Ewebserver使用的证书路径
num_threads = 50;   启动线程的个数
request_timeout_ms = 30000; 请求的超时时间，单位：ms
max_connections = 100;  最大的连接数
insecure = no;    是否安全
eweb_prefix_url = http://192.168.0.6/trans/download/; Ewebserver链接的前缀
eweb_address_header = http://192.168.0.6:8082/; Ewebserver 地址头

[VRPC]
rpc_someip_route_add = route add -n 255.255.255.255 gw 192.168.225.1 dev bridge0; 配置someip使用的路由
rpc_someip_unicast_ip = 192.168.0.6;    SOA服务单播地址
rpc_someip_log_path_name = /tmp/admota/xpc/log/vrpc.log;  RPC的日志路径
rpc_someip_data_path_name = /tmp/admota/xpc/log/vrpc.data;  RPC data的路径
rpc_someip_runtime_dir = /tmp/admota/xpc/admnv/tmp/;   RPC 的运行时目录