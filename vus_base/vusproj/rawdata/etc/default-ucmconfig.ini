[VER]
ota_config_ver = 0.0.9 ; otaconfig.ini 文件版本号，所有人修改配置文件后，请自增版本号
ota_config_ver_time = 2024-08-08 20:00; 最后一次修改的时间，请修改者记录
ota_config_ver_modify_author = maxiangyang;   最后的修改者，请修改作者名，用于记录最新版本的修改人
ota_config_ver_modify_content = Initial creation, route add of someip rpc \
ota_config_oem_logo = ABUP DEFAULT_VEHICLE; OEM的标识，包括：车厂和车型等

[VUS]
is_real_vehicle_ver = N;        Y:实车版本; N:非实车版本
#default_vehicle_iden = LVVDB11BXNE060101;   默认的台架测试vin码，测试同学可修改   
default_vehicle_iden = E0111111111111113;   默认的台架测试vin码，测试同学可修改   
is_kvstorage_encrypt = Y;       Y:需要加密; N:不需要加密
is_coredump_upload = Y;         Y:系统崩溃后生成并上报coredump信息; N:不
is_detach_retry = Y;           是否分离刷写重试和回滚，TRUE(1):Y, FALSE(0):N

runtime_root_dir = /tmp/fota/abupota/ucm/;    VUS主控程序运行的主目录
kv_storage_dir = /tmp/fota/abupota/kvstorage/; VUS主控程序，kv持久存储目录
pkg_storage_dir = /tmp/fota/abupota/ucm/package/; VUS主控程序升级包下载的存储目录
log_storage_dir = /tmp/fota/abupota/ucm/log/storage/; VUS主控程序日志存储目录
log_collect_dir = /tmp/fota/abupota/ucm/log/collect/; VUS主控程序日志收集存储目录
log_pack_dir = /tmp/fota/abupota/ucm/log/pack/;       被收集日志打包后的存储目录
cert_storage_dir = /tmp/fota/abupota/ucm/cert/; VUS主控程序日志存储目录
unzip_storage_dir = /tmp/fota/abupota/ucm/unzip/;  VUS主控程序解压信息存储目录
apk_log_storage_dir = /tmp/fota/abupota/cache/logger/; VUS主控程序APK日志存储目录
log_dim_lvm_storage_dir = /tmp/fota/abupota/dimtool/log/storage/; VUS dimtool主程序存储日志目录

pki_storage_dir = /tmp/fota/abupota/pki/; VUS主控程序，pki数据存储目录,可读写 & 持久化存储
curl_verbose_dir = /tmp/fota/abupota/curl.log; VUS主控程序，curl详细信息输出文件

wait_network_ok_sec = 10;       进程启动等待网络恢复的时间，单位:Second
wait_network_ok_count = 3;		进程启动等待网络恢复尝试次数
hmipolicyfile_is_download = Y;  是否需要下载HMI策略文件

is_set_kvdata_abnormal_deal = N;     Y：异常处理 N：不异常处理
process_restart_times = 10;          进程重启次数
process_restart_totaltime = 600;     该时间内达到重启次数，需要清空数据库，单位:Second

log_max_size_of_single_file = 5242880;    单个日志文件存储的大小，单位：5MB
log_max_rotate_file = 5;                  最多存储的文件个数
log_output_terminal = Y;  是否需要下log输出至串口终端
rpc_comm_cert_path = ../etc/rpccomm.cert; VUS主控程序与从控程序通信使用的证书路径

is_start_http_proxy = Y;  是否需要开启网络代理
http_proxy_cfg_path = ../etc/httpproxyCfg.ini; 网络代理配置文件路径

dts_lib_path = ../lib/libadmdts.so; VUS日志模块的动态库路径
dts_config_path = ../etc/admdts.conf; VUS日志模块的配置文件路径

comm_cert_path = ../etc/comm.cert; VUS主控程序与OTA平台通信的证书路径(注册、检测、上报等)
cdn_cert_path = /tmp/fota/etc/cdn_lite_splice.cert; VUS主控程序与CDN平台通信的证书路径(升级包下载)
cdn_cert_dir = /etc/ssl/certs;           系统证书路径

ota_server_protocol_type = 2; 1:http; 2:https; 3:mqtt; 4. mqtts
ota_server_business_protocol_type = 2; 1:http; 2:https; 3:mqtt; 4. mqtts
ota_server_file_download_protocol_type = 2; 1:http; 2:https; 3:mqtt; 4:mqtts
ota_server_file_upload_protocol_type = 2; 1:http; 2:https; 3:mqtt; 4:mqtts
ota_server_default_secret = 39cabdfaab8c4da09bd6e9823c527836;   车云通信使用的默认Secret
ota_server_register_url =https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/register; 向OTA平台请求注册的地址
ota_server_check_url =https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/%s/check; 向OTA平台请求检测的地址
ota_server_get_config_url =https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/%s/client/config; 向OTA平台请求获取配置的地址
ota_server_get_icp_url = https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/%s/queryIcpRecord; 向OTA平台请求获取ICP的地址
ota_server_report_vehicle_info_url =https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/%s/report/vehicle/config; 向OTA平台请求上报车辆信息的地址
ota_server_vehicle_state_report_url =https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/%s/state/report; 向OTA平台请求上报车辆状态的地址
ota_server_ecu_state_report_url =https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/%s/ecu/state/report; 向OTA平台请求上报ECU状态的地址
ota_server_progress_report_url =https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/%s/progress/report; 向OTA平台请求上报进度信息的地址
ota_server_event_report_url =https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/%s/event/report; 向OTA平台请求上报事件的地址
ota_server_file_upload_url =https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/%s/file/upload; 向OTA平台请求上传日志的地址
ota_server_pre_check_url =https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/%s/pre/check; 向OTA平台请求预检测的地址
ota_server_get_history_url =https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/%s/upgrade/history; 向OTA平台请求查询升级历史记录的地址
ota_server_sync_schdule_url =https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/%s/prepare/upgrade; 向OTA平台同步预约信息的地址
ota_server_task_verify_url  =https://api-ota-lioncloud-stg.mychery.com/v50/vehicle/api/%s/task/verify; 向OTA平台请求任务有效性的地址
ota_server_soa_ssl_verify_client = Y;  车云消息通信是否开启双向认证
ota_server_soa_ssl_download_verify_client = N;  cdn是否开启双向认证
   
ota_server_soa_ssl_client_certfile = ../etc/otaClient.crt; 车云客户端证书路径
ota_server_soa_ssl_client_keyfile = ../etc/otaClient.key;  车云客户端私钥

ota_server_soa_cdn_ssl_client_certfile = ../etc/cdnClient.crt; cdn客户端证书路径
ota_server_soa_cdn_ssl_client_keyfile = ../etc/cdnClient.key;  cdn客户端私钥

pki_server_url = "https://pkipgw-uat.cheryinternational.com:6443/cn"; PKI请求地址

event_report_level = 3;     1:TRACE低等级的事件（打点事件）; 2: DEBUG调试级别的事件; 3: INFO 状态事件; 4:WARN 潜在错误报警; 5: ERROR 程序发生错误

uim_instanceid = 1;

vdi_instanceid = 4098; ','分隔多个实例id, 0x1002, 例:4097,4098
ucl_instanceid = 8194,8193,8195; ','分隔多个实例id, 0x2002 0x2001 0x2003    0x2002作为主控的从控放在第一位
host_instanceid = 8194,8193; ','分隔多个实例id, 0x2002, 0x2001              0x2001作为tbox放在第二位
hmi_instanceid = 8194;	0X2002

dim_impl_lib_path = ../lib/libdisjsonsoc.so; X86场景下dim impl实例库路径libdisprotosoc.so或libdisjsonsoc.so.
soa_impl_lib_path = ../lib/libsoasoc.so; soa impl 实例库路径.
uim_impl_lib_path = ../lib/libuisjsonsoc.so; soa impl 实例库路径.	

upgrade_parallel_num_limit_m = 5;   升级ECU并行数量限制M
upgrade_parallel_num_limit_n = 1;   升级ECU并行数量限制N

ucm_appid = UCM; tracer-ucm
#dim_lvm_modules = vdi;     调用native的dis层模拟函数响应dim模块。 如果未打开则还是走arpc调用sysi层进行响应。支持 ucl,host,vdi模块模拟

[EWEB]
document_root_dir = /tmp/fota/abupota/; Ewebserver使用的主目录
document_upload_dir = /tmp/fota/abupota/ucm/trans/upload/; Ewebserver使用的文件上传目录
document_download_dir = /tmp/fota/abupota/ucm/trans/download/; Ewebserver使用文件的下载目录
log_storage_path = /tmp/fota/abupota/ucm/log/storage/ewebsrvlog.txt;  Ewebserver存储日志文件的路径
is_https = N;   Ewebserver是否为HTTPS协议
listening_ip = 127.0.0.1;     Ewebserver监听的IP
listening_ports = 8082;  Ewebserver监听的端口
enable_keep_alive = no;   保持长链接状态
eweb_ssl_certificate = /tmp/fota/etc/ewebServer.pem; Ewebserver使用的证书路径，该文件包含私钥(格式必须为pem)
eweb_ca_certificate = /tmp/fota/etc/ewebCA.pem; Ewebserver使用的CA证书路径(格式必须为pem)
eweb_verify_peer = N;     Ewebserver是否打开双向认证
num_threads = 50;   启动线程的个数
request_timeout_ms = 30000; 请求的超时时间，单位：ms
max_connections = 100;  最大的连接数
insecure = no;    是否安全
eweb_prefix_url = http://127.0.0.1:8082/ucm/trans/download/;
eweb_address_header = http://127.0.0.1:8082/;
eweb_file_download_protocol_type = 1;   1:http; 2:https;
eweb_file_upload_protocol_type = 1;     1:http; 2:https;

eweb_ssl_client_keyfile = ../etc/ewebClient.key;	Ewebserver的客户端证书
eweb_ssl_client_certfile = ../etc/ewebClient.crt;	Ewebserver的客户端私钥

[DIS_SOC]
soa_soc_tcp_mode = 2; 1:client, 2:server
soa_tcp_server_port = 12345;  SOA服务端口
soa_tcp_host_ip = 127.0.0.1; SOA地址, 自身ucm ip

soa_soc_try_connect_time = -1;  掉线重连,重试次数; -1 一直重试
soa_soc_try_connect_interval = 15; 重连时间间隔

soa_soc_heart_count = 3;   最大次数内无心跳, 进入掉线重连阶段
soa_soc_heart_interval = 15;  心跳时间间隔

soa_with_ssl = N;

soa_ssl_cafile = ../etc/arpcCA.crt;
soa_ssl_certfile = ../etc/arpcServer.crt;
soa_ssl_keyfile = ../etc/arpcServer.key;

soa_ssl_ciphers = ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
soa_ssl_protocols = TLSv1.2;

#是否打开双向认证，如果下面为off，则客户端不需要配置自己的证书私钥
soa_ssl_verify_client = N;
soa_ssl_client_cafile = ../etc/arpcCA.crt;
soa_ssl_client_certfile = ../etc/arpcClient.crt;
soa_ssl_client_keyfile = ../etc/arpcClient.key;

#线程数控制
soa_soc_min_thread_num = 2;
soa_soc_max_thread_num = 8;
