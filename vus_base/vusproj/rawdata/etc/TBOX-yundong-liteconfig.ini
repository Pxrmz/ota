[VER]
ota_config_ver = 0.0.1 ; otaconfig.ini 文件版本号，所有人修改配置文件后，请自增版本号
ota_config_ver_time = 2022-01-12 10:31 ; 最后一次修改的时间，请修改者记录
ota_config_ver_modify_author = mengwei;   最后的修改者，请修改作者名，用于记录最新版本的修改人
ota_config_ver_modify_content = Initial creation, route add of someip rpc \
增加日志大小和存储文件个数配置 \
增加KVStorage的存储目录，并修改程序运行的默认目录 \
增加实车版本和非实车版本标识，用于区分获取默认vin和实车上获取vin \
增加进程启动等待网络恢复的时间配置选项 \
增加文件解压的指定目录 \
增加车云通信使用的默认secret \
增加kvstorage是否加密存储的标识 \
增加文件下载的协议类型配置 \
增加日志收集和收集后的压缩文件存储目录 ; 所有修改者请记录修改的内容
ota_config_oem_logo = M1EFL1; OEM的标识，包括：车厂和车型等

[VUS]
wait_network_ok_sec = 10;       进程启动等待网络恢复的时间，单位:Second
wait_network_ok_count = 3;      进程启动等待网络恢复尝试次数

ucl_instanceid = 8193;  0X2001 	
host_instanceid = 8193; 0X2001
trans_instanceid = 8193; 0X2001

uim_instanceid = 1;

is_http_proxy = Y;  是否需要开启网络代理
http_proxy_ip = "192.168.225.10:51028"; 代理网络ip地址,ip:端口

cdn_cert_dir = /etc/ssl/certs/;  系统证书路径
cdn_cert_path =/ydsdata/mmc0/log/fota/abupota/lite/cert/cdn_splice.cert; VUS主控程序与CDN平台通信的证书路径(升级包下载)
ota_server_file_download_protocol_type = 2; 1:http; 2:https; 3:mqtt; 4:mqtts

soa_impl_lib_path = /ydsapp/yodo/sysi/lib/libsoasoc.so ; soa impl 实例库路径.
sysi4loader_path = /ydsapp/yodo/sysi/lib/libsysi4jsonsoc.so;  X86场景下libsysi4protosoc.so或libsysi4jsonsoc.so

module_name = "LITE_TBOX";
keylog_log_max_size = 2097152;
keylog_path = /ydsdata/mmc0/log/fota/abupota/lite/keylog/keylog.txt;  SYSI程序keylog日志文件路径
is_report_keylog = Y;  是否记录并上报keylog文件

[SYSI]
runtime_root_dir =/ydsdata/mmc0/log/fota/abupota/lite/; SYSI程序运行主目录
kv_storage_dir =/ydsdata/mmc0/log/fota/abupota/lite/kvstorage/; SYSI程序，kv持久存储目录
pkg_storage_dir =/ydsdata/mmc0/log/fota/abupota/lite/package/;  SYSI程序升级包下载目录
log_storage_dir =/ydsdata/mmc0/log/fota/abupota/lite/log/storage/; SYSI程序日志存储目录
log_collect_dir =/ydsdata/mmc0/log/fota/abupota/lite/log/collect/; SYSI程序日志收集存储目录
log_pack_dir =/ydsdata/mmc0/log/fota/abupota/lite/log/pack/;       被收集日志打包后的存储目录
cert_storage_dir =/ydsdata/mmc0/log/fota/abupota/lite/cert/; SYSI程序证书存储目录
unzip_storage_dir =/ydsdata/mmc0/log/fota/abupota/lite/unzip/;  SYSI程序解压信息存储目录
parallel_collect_style_dir =/ydsdata/mmc0/log/fota/abupota/lite/parallelCollect/; 并行采集方式记录目录
upgrade_result_record =/ydsdata/mmc0/log/fota/abupota/lite/resultRecord/; 升级结果记录
is_control_active =/ydsdata/mmc0/log/fota/abupota/lite/controlActive/; 激活控制记录

log_max_size_of_single_file = 2097152;    单个日志文件存储的大小，单位：Byte
log_max_rotate_file = 1;                  最多存储的文件个数
log_output_terminal = N;                  是否输出到终端

comm_cert_path = /ydsapp/yodo/sysi/etc/comm.crt;   SYSI程序与OTA平台通信的证书路径
cdn_cert_dir = /etc/ssl/certs/;  系统证书路径
cdn_cert_path =/ydsdata/mmc0/log/fota/abupota/lite/cert/cdn_splice.cert; VUS主控程序与CDN平台通信的证书路径(升级包下载)
trans_cert_path = /ydsapp/yodo/sysi/etc/trans.crt; SYSI程序与传输服务通信的证书路径
rpc_comm_cert_path = /ydsapp/yodo/sysi/etc/rpccomm.cert; SYSI从控程序与VUS主控程序通信使用的证书路径

sysi_appid = SYSI; tracer-sysi

[DIS_SOC]
soa_soc_tcp_mode = 1; 1:client, 2:server
soa_tcp_server_ip = 192.168.225.10;  SOA服务IP, ucm ip
soa_tcp_server_port = 51020;  SOA服务端口

soa_tcp_host_ip = 192.168.225.1; SOA地址, 自身ip

soa_soc_try_connect_time = -1;  掉线重连,重试次数; -1 一直重试
soa_soc_try_connect_interval = 15; 重连时间间隔

soa_soc_heart_count = 3;   最大次数内无心跳, 进入掉线重连阶段
soa_soc_heart_interval = 15;  心跳时间间隔

soa_with_ssl = N;

soa_ssl_cafile = /ydsapp/yodo/sysi/etc/arpcCA.crt;
soa_ssl_certfile = /ydsapp/yodo/sysi/etc/arpcServer.crt;
soa_ssl_keyfile = /ydsapp/yodo/sysi/etc/arpcServer.key;

soa_ssl_ciphers = ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
soa_ssl_protocols = TLSv1.2;

#是否打开双向认证，如果下面为off，则客户端不需要配置自己的证书私钥
soa_ssl_verify_client = N;
soa_ssl_client_cafile = /ydsapp/yodo/sysi/etc/arpcCA.crt;
soa_ssl_client_certfile = /ydsapp/yodo/sysi/etc/arpcClient.crt;
soa_ssl_client_keyfile = /ydsapp/yodo/sysi/etc/arpcClient.key;

#线程数控制
soa_soc_min_thread_num = 2;
soa_soc_max_thread_num = 8;

[EWEB]
eweb_file_download_protocol_type = 1;   1:http; 2:https;
eweb_file_upload_protocol_type = 1;     1:http; 2:https;
eweb_verify_peer = N;     Ewebserver是否打开双向认证
eweb_ssl_client_keyfile =/ydsapp/yodo/sysi/etc/ewebClient.key;	Ewebserver的客户端证书,注意该目录是否含有证书
eweb_ssl_client_certfile = /ydsapp/yodo/sysi/etc/ewebClient.crt;	Ewebserver的客户端私钥，,注意该目录是否含有私钥
eweb_ca_certificate = /ydsapp/yodo/sysi/etc/ewebCA.pem; Ewebserver使用的证书路径，该文件包含私钥(格式必须为pem)，,注意该目录是否含有证书
eweb_address_header = http://0.0.0.0:51027/;
