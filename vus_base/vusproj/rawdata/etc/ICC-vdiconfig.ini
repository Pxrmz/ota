[VER]
ota_config_ver = 0.0.1 ; otaconfig.ini 文件版本号，所有人修改配置文件后，请自增版本号
ota_config_ver_time = 2022-01-12 10:31 ; 最后一次修改的时间，请修改者记录
ota_config_ver_modify_author = mengwei;   最后的修改者，请修改作者名，用于记录最新版本的修改人
ota_config_ver_modify_content = Initial creation, route add of someip rpc \
增加日志大小和存储文件个数配置 \
增加KVStorage的存储目录，并修改程序运行的默认目录 \
增加实车版本和非实车版本标识，用于区分获取默认vin和实车上获取vin \
增加进程启动等待网络恢复的时间配置选项 \
增加文件解压的指定目录 \
增加车云通信使用的默认secret \
增加kvstorage是否加密存储的标识 \
增加文件下载的协议类型配置 \
增加日志收集和收集后的压缩文件存储目录 ; 所有修改者请记录修改的内容
ota_config_oem_logo = M1EFL1; OEM的标识，包括：车厂和车型等

[VUS]
wait_network_ok_sec = 10;       进程启动等待网络恢复的时间，单位:Second
wait_network_ok_count = 3;      进程启动等待网络恢复尝试次数

ucl_instanceid = 4098;
vdi_instanceid = 4098;  0X1002
trans_instanceid = 4098; 0X1002

uim_instanceid = 1;

cdn_cert_path = /emmc/svp/tpa/ota_lion/m1e/etc/cdn.cert; VUS主控程序与CDN平台通信的证书路径(升级包下载)
ota_server_file_download_protocol_type = 2; 1:http; 2:https; 3:mqtt; 4:mqtts

soa_impl_lib_path = /emmc/svp/tpa/ota_lion/m1e/lib/libsoasoc.so ; soa impl 实例库路径.
sysi4loader_path = /emmc/svp/tpa/ota_lion/m1e/lib/libsysi4jsonsoc.so;  X86场景下libsysi4protosoc.so或libsysi4jsonsoc.so

module_name = "LITE_IHU_QNX";
keylog_log_max_size = 2097152;
keylog_path = /var/ota/abupota/lite4vdi/keylog/keylog.txt;  SYSI程序keylog日志文件路径
is_report_keylog = Y;  是否记录并上报keylog文件

[SYSI]
runtime_dependency_dir = /var/ota/abupota/;   SYSI程序依赖的主目录
runtime_root_dir = /var/ota/abupota/lite4vdi/; SYSI程序运行主目录
kv_storage_dir = /var/ota/abupota/lite4vdi/kvstorage/; SYSI程序，kv持久存储目录
pkg_storage_dir = /var/ota/abupota/lite4vdi/package/;  SYSI程序升级包下载目录
log_storage_dir = /var/ota/abupota/lite4vdi/log/storage/; SYSI程序日志存储目录
log_collect_dir = /var/ota/abupota/lite4vdi/log/collect/; SYSI程序日志收集存储目录
log_pack_dir = /var/ota/abupota/lite4vdi/log/pack/;       被收集日志打包后的存储目录
cert_storage_dir = /var/ota/abupota/lite4vdi/cert/; SYSI程序证书存储目录
unzip_storage_dir = /var/ota/abupota/lite4vdi/unzip/;
parallel_collect_style_dir = /var/ota/abupota/lite4vdi/parallelCollect/; 并行采集方式记录目录
vdi_shared_dir  = /var/ota/abupota/lite4vdi/package/transCfgPkg/; 脚本目录

log_max_size_of_single_file = 5242880;    单个日志文件存储的大小，单位：Byte
log_max_rotate_file = 5;                  最多存储的文件个数
log_output_terminal = N;                  是否输出到终端

comm_cert_path = /emmc/svp/tpa/ota_lion/m1e/etc/comm.crt;   SYSI程序与OTA平台通信的证书路径
cdn_cert_path = /emmc/svp/tpa/ota_lion/m1e/etc/cdn.crt; SYSI程序与CDN平台通信的证书路径
trans_cert_path = /emmc/svp/tpa/ota_lion/m1e/etc/trans.crt; SYSI程序与传输服务通信的证书路径
rpc_comm_cert_path = /emmc/svp/tpa/ota_lion/m1e/etc/rpccomm.cert; SYSI从控程序与VUS主控程序通信使用的证书路径

vdi_test_path = /var/ota/abupota/lite4vdi/log/storage/;  vdi提供模拟数据以及日志文件存放相对路径

sysi_appid = SYSI; tracer-sysi
vdi_3e80_timeout = 5400     ;强制关闭3E80的定时器时间,90分钟
vdi_delay_close_time = 2    ;延迟关闭所有doip连接的定时器时间，单位：秒；0 表示不延迟关闭;非0 表示延迟关闭，建议默认值：2秒（按照Lotus最后量产的经验值）

#sysi_lvm_modules = host, ucl;  sysi使用lvm模拟数据的模块

[DIS_SOC]
soa_soc_tcp_mode = 1; 1:client, 2:server
soa_tcp_server_ip = 192.168.8.2;  SOA服务IP, ucm ip
soa_tcp_server_port = 51020;  SOA服务端口

soa_tcp_host_ip = 192.168.8.1; SOA地址, 自身ip

soa_soc_try_connect_time = -1;  掉线重连,重试次数; -1 一直重试
soa_soc_try_connect_interval = 15; 重连时间间隔

soa_soc_heart_count = 3;   最大次数内无心跳, 进入掉线重连阶段
soa_soc_heart_interval = 15;  心跳时间间隔

soa_with_ssl = N;

soa_ssl_cafile = /emmc/svp/tpa/ota_lion/m1e/etc/arpcCA.crt;
soa_ssl_certfile = /emmc/svp/tpa/ota_lion/m1e/etc/arpcServer.crt;
soa_ssl_keyfile = /emmc/svp/tpa/ota_lion/m1e/etc/arpcServer.key;

soa_ssl_ciphers = ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
soa_ssl_protocols = TLSv1.2;

#是否打开双向认证，如果下面为off，则客户端不需要配置自己的证书私钥
soa_ssl_verify_client = N;
soa_ssl_client_cafile = /emmc/svp/tpa/ota_lion/m1e/etc/arpcCA.crt;
soa_ssl_client_certfile = /emmc/svp/tpa/ota_lion/m1e/etc/arpcClient.crt;
soa_ssl_client_keyfile = /emmc/svp/tpa/ota_lion/m1e/etc/arpcClient.key;

#线程数控制
soa_soc_min_thread_num = 2;
soa_soc_max_thread_num = 6;

[EWEB]
eweb_file_download_protocol_type = 1;   1:http; 2:https;
eweb_file_upload_protocol_type = 1;     1:http; 2:https;
eweb_verify_peer = N;     Ewebserver是否打开双向认证
eweb_ssl_client_keyfile = /emmc/svp/tpa/ota_lion/m1e/etc/ewebClient.key;	Ewebserver的客户端证书,注意该目录是否含有证书
eweb_ssl_client_certfile = /emmc/svp/tpa/ota_lion/m1e/etc/ewebClient.crt;	Ewebserver的客户端私钥，,注意该目录是否含有私钥
eweb_ca_certificate = /emmc/svp/tpa/ota_lion/m1e/etc/ewebCA.pem; Ewebserver使用的证书路径，该文件包含私钥(格式必须为pem)，,注意该目录是否含有证书
